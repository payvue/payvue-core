      <stop stop-color="#F8F5FF"/>
      <stop offset="0.58" stop-color="#F1EBFF"/>
      <stop offset="1" stop-color="#ECE7FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="210" y1="230" x2="1390" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11V0Z" fill="#8B5CF6" fill-opacity="0.82"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1298" cy="122" rx="230" ry="94" fill="#DDD6FE" fill-opacity="0.72"/>
  <ellipse cx="262" cy="792" rx="286" ry="112" fill="#E9D5FF" fill-opacity="0.4"/>

  <rect x="130" y="106" width="1340" height="688" rx="34" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2" filter="url(#shadow)"/>

  <text x="190" y="174" fill="#6D28D9" font-size="32" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">
