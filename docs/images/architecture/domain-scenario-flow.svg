  <line x1="964" y1="470" x2="964" y2="540" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="976" y="510" fill="#5B21B6" font-size="14" font-family="IBM Plex Sans KR, sans-serif" font-weight="600">아니오</text>

  <circle cx="860" cy="560" r="50" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <circle cx="860" cy="560" r="11" stroke="#DC2626" stroke-width="2"/>
  <path d="M855 555L865 565M865 555L855 565" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  <text x="838" y="632" fill="#DC2626" font-size="18" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">거절</text>

  <line x1="1250" y1="390" x2="1370" y2="390" stroke="#8B5CF6" stroke-width="2.6"/>
  <line x1="1370" y1="390" x2="1370" y2="560" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#arrow)"/>
  <line x1="910" y1="560" x2="1312" y2="560" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#arrow)"/>

  <rect x="430" y="500" width="330" height="154" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="452" y="530" fill="#7C3AED" font-size="15" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">판단 기준</text>
  <text x="452" y="558" fill="#4B5563" font-size="13.5" font-family="IBM Plex Sans KR, sans-serif" font-weight="500">
    - 필수 승인자(역할)가 모두 동의했는가?
  </text>
  <text x="452" y="584" fill="#4B5563" font-size="13.5" font-family="IBM Plex Sans KR, sans-serif" font-weight="500">
    - 자동 승인 규칙에 해당하는가?
  </text>
  <text x="452" y="610" fill="#4B5563" font-size="13.5" font-family="IBM Plex Sans KR, sans-serif" font-weight="500">
    - 예외 조건(한도 초과, 목적 불일치 등)은 없는가?
  </text>
  <line x1="760" y1="520" x2="924" y2="470" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="4 4"/>

  <circle cx="1370" cy="560" r="58" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <ellipse cx="1370" cy="548" rx="11" ry="5" stroke="#6D28D9" stroke-width="2"/>
  <path d="M1359 548V571C1359 574 1364 577 1370 577C1376 577 1381 574 1381 571V548" stroke="#6D28D9" stroke-width="2"/>
  <text x="1324" y="640" fill="#6D28D9" font-size="17" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">사건 고정</text>

  <rect x="170" y="720" width="1260" height="52" rx="12" fill="#FBFAFF" stroke="url(#accent)" stroke-width="2"/>
  <text x="200" y="755" fill="#5B21B6" font-size="20" font-family="IBM Plex Sans KR, sans-serif" font-weight="600">
