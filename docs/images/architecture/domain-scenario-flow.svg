  <circle cx="270" cy="390" r="56" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <circle cx="270" cy="378" r="11" stroke="#6D28D9" stroke-width="2"/>
  <path d="M253 404C256 394 263 389 270 389C277 389 284 394 287 404" stroke="#6D28D9" stroke-width="2" stroke-linecap="round"/>
  <text x="238" y="468" fill="#6D28D9" font-size="18" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">요청</text>

  <line x1="326" y1="390" x2="444" y2="390" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#arrow)"/>

  <circle cx="500" cy="390" r="56" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <path d="M500 356L518 364V380C518 392 510 401 500 407C490 401 482 392 482 380V364L500 356Z" stroke="#6D28D9" stroke-width="2" fill="none"/>
  <path d="M492 381L497 386L507 375" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="455" y="468" fill="#6D28D9" font-size="18" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">규칙 검증</text>

  <line x1="556" y1="390" x2="674" y2="390" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#arrow)"/>

  <circle cx="730" cy="390" r="56" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <path d="M711 412L730 376L749 412H711Z" stroke="#6D28D9" stroke-width="2" fill="none"/>
  <line x1="730" y1="386" x2="730" y2="398" stroke="#6D28D9" stroke-width="2" stroke-linecap="round"/>
  <circle cx="730" cy="404" r="1.8" fill="#6D28D9"/>
  <text x="694" y="468" fill="#6D28D9" font-size="18" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">예외 확인</text>

  <line x1="786" y1="390" x2="884" y2="390" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#arrow)"/>

  <polygon points="884,390 964,310 1044,390 964,470" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="956" y="387" fill="#6D28D9" font-size="28" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">?</text>
  <text x="916" y="495" fill="#6D28D9" font-size="18" font-family="IBM Plex Sans KR, sans-serif" font-weight="700">판단</text>

  <line x1="1044" y1="390" x2="1144" y2="390" stroke="#8B5CF6" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="1048" y="374" fill="#5B21B6" font-size="14" font-family="IBM Plex Sans KR, sans-serif" font-weight="600">예</text>

  <circle cx="1200" cy="390" r="50" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
